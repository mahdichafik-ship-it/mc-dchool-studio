# Builds Windows (.exe NSIS installer) and macOS (.dmg universal) desktop
# packages on every `v*` tag push and attaches them to the GitHub Release.
#
# Trigger: git tag v1.2.3 && git push origin v1.2.3
#
# Note: pnpm-workspace.yaml contains overrides that exclude non-Linux platform
# binaries so they are not installed inside the Replit environment. This
# workflow strips those Replit-only overrides before running `pnpm install` so
# that the correct native binaries are fetched for each runner OS.

name: Desktop Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # required to create/update GitHub Releases and upload assets

jobs:
  # ---------------------------------------------------------------------------
  # macOS — produces separate installers for Intel and Apple silicon Macs.
  # ---------------------------------------------------------------------------
  build-mac:
    # Pin a stable runner: the latest image can change independently of
    # electron-builder and has caused DMG conversion failures.
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release tag matches app version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "const fs=require('fs'); const tag=process.env.RELEASE_TAG; const version=JSON.parse(fs.readFileSync('artifacts/mc-school-studio-desktop/package.json','utf8')).version; if(tag !== 'v'+version){console.error('Release tag '+tag+' must match desktop package version v'+version);process.exit(1)}"

      - name: Verify macOS signing credentials
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for secret_name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!secret_name:-}" ]; then
              missing+=("$secret_name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Tagged macOS releases require signing and notarization secrets: ${missing[*]}"
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Decode macOS signing certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')

          const certificate = Buffer.from(process.env.CSC_LINK, 'base64')
          if (certificate.length === 0) {
            throw new Error('CSC_LINK did not decode to a certificate file')
          }

          fs.writeFileSync(
            path.join(process.env.RUNNER_TEMP, 'mac-signing-certificate.p12'),
            certificate,
          )
          NODE
          echo "CSC_LINK=$RUNNER_TEMP/mac-signing-certificate.p12" >> "$GITHUB_ENV"

      - name: Strip Replit-only platform overrides
        run: node scripts/strip-replit-overrides.mjs

      - name: Install dependencies
        # --no-frozen-lockfile because we modified pnpm-workspace.yaml above;
        # the lockfile was generated on Linux and does not include darwin entries.
        run: pnpm install --no-frozen-lockfile

      - name: Build & package macOS DMG
        # dist:mac runs `electron-vite build && electron-builder --mac` inside
        # the desktop package directory, so electron-builder.yml is found
        # automatically (no --config path needed).
        run: pnpm --filter @workspace/mc-school-studio-desktop run dist:mac
        env:
          # The preflight step requires all macOS signing and notarization
          # secrets before this tagged release can be packaged.
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: "true"
          # These are used by electron-builder's macOS notarization step.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload DMG to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/mc-school-studio-desktop/dist/release/*.dmg
            artifacts/mc-school-studio-desktop/dist/release/*.zip
            artifacts/mc-school-studio-desktop/dist/release/latest-mac.yml
            artifacts/mc-school-studio-desktop/dist/release/*.blockmap

  # ---------------------------------------------------------------------------
  # Windows — produces an NSIS .exe installer (x64)
  # ---------------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release tag matches app version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "const fs=require('fs'); const tag=process.env.RELEASE_TAG; const version=JSON.parse(fs.readFileSync('artifacts/mc-school-studio-desktop/package.json','utf8')).version; if(tag !== 'v'+version){console.error('Release tag '+tag+' must match desktop package version v'+version);process.exit(1)}"

      - name: Verify Windows signing credentials
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          $requiredSecrets = @("WIN_CSC_LINK", "WIN_CSC_KEY_PASSWORD")
          $missing = $requiredSecrets | Where-Object {
            [string]::IsNullOrWhiteSpace(
              [Environment]::GetEnvironmentVariable($_)
            )
          }

          if ($missing) {
            Write-Error (
              "Tagged Windows releases require signing secrets: " +
              ($missing -join ", ")
            )
            exit 1
          }

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Decode Windows signing certificate
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "windows-signing-certificate.pfx"

          try {
            [IO.File]::WriteAllBytes(
              $certificatePath,
              [Convert]::FromBase64String($env:WIN_CSC_LINK)
            )
          } catch {
            throw "WIN_CSC_LINK must contain a base64-encoded .p12 or .pfx certificate."
          }

          if ((Get-Item $certificatePath).Length -eq 0) {
            throw "WIN_CSC_LINK did not decode to a certificate file."
          }

          Add-Content -Path $env:GITHUB_ENV -Value "WIN_CSC_LINK=$certificatePath"

      - name: Strip Replit-only platform overrides
        run: node scripts/strip-replit-overrides.mjs

      - name: Install dependencies
        # --no-frozen-lockfile — same reason as macOS job above.
        run: pnpm install --no-frozen-lockfile

      - name: Build & package Windows installer
        # dist:win runs `electron-vite build && electron-builder --win` inside
        # the desktop package directory, so electron-builder.yml is found
        # automatically (no --config path needed).
        run: pnpm --filter @workspace/mc-school-studio-desktop run dist:win
        env:
          # electron-builder uses the Windows-specific variables for the
          # Authenticode certificate and its private-key password.
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Upload installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/mc-school-studio-desktop/dist/release/*.exe
            artifacts/mc-school-studio-desktop/dist/release/latest.yml
            artifacts/mc-school-studio-desktop/dist/release/*.blockmap
