# Builds signed Windows and signed/notarized macOS desktop packages on every
# `v*` tag push and attaches them to the GitHub Release.
#
# Trigger: git tag v1.2.3 && git push origin v1.2.3
#
# Note: pnpm-workspace.yaml contains overrides that exclude non-Linux platform
# binaries so they are not installed inside the Replit environment. This
# workflow strips those Replit-only overrides before running `pnpm install` so
# that the correct native binaries are fetched for each runner OS.

name: Desktop Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # required to create/update GitHub Releases and upload assets

jobs:
  # ---------------------------------------------------------------------------
  # macOS — produces separate installers for Intel and Apple silicon Macs.
  # ---------------------------------------------------------------------------
  build-mac:
    # Pin a stable runner: the latest image can change independently of
    # electron-builder and has caused DMG conversion failures.
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release tag matches app version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "const fs=require('fs'); const tag=process.env.RELEASE_TAG; const version=JSON.parse(fs.readFileSync('artifacts/mc-school-studio-desktop/package.json','utf8')).version; if(tag !== 'v'+version){console.error('Release tag '+tag+' must match desktop package version v'+version);process.exit(1)}"

      - name: Verify macOS signing credentials
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for secret_name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!secret_name:-}" ]; then
              missing+=("$secret_name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Tagged macOS releases require signing and notarization secrets: ${missing[*]}"
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Decode macOS signing certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')

          const certificate = Buffer.from(process.env.CSC_LINK, 'base64')
          if (certificate.length === 0) {
            throw new Error('CSC_LINK did not decode to a certificate file')
          }

          fs.writeFileSync(
            path.join(process.env.RUNNER_TEMP, 'mac-signing-certificate.p12'),
            certificate,
          )
          NODE
          echo "CSC_LINK=$RUNNER_TEMP/mac-signing-certificate.p12" >> "$GITHUB_ENV"

      - name: Strip Replit-only platform overrides
        run: node scripts/strip-replit-overrides.mjs

      - name: Install dependencies
        # --no-frozen-lockfile because we modified pnpm-workspace.yaml above;
        # the lockfile was generated on Linux and does not include darwin entries.
        run: pnpm install --no-frozen-lockfile

      - name: Build & package macOS DMG
        run: pnpm --filter @workspace/mc-school-studio-desktop run dist:mac
        env:
          # The preflight step requires all macOS signing and notarization
          # secrets before this tagged release can be packaged.
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: "true"
          # These are used by electron-builder's macOS notarization step.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify macOS packages are signed and notarized
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"

          verify_app() {
            app_path="$1"

            if [ -z "$app_path" ]; then
              echo "::error::No app bundle found"
              exit 1
            fi

            codesign --verify --deep --strict --verbose=2 "$app_path"
            spctl --assess --type execute --verbose=2 "$app_path"
            xcrun stapler validate "$app_path"
          }

          for arch in x64 arm64; do
            dmg="artifacts/mc-school-studio-desktop/dist/release/mc-school-studio-${version}-${arch}.dmg"
            zip="artifacts/mc-school-studio-desktop/dist/release/mc-school-studio-${version}-${arch}.zip"
            test -f "$dmg"
            test -f "$dmg.blockmap"
            test -f "$zip"
            test -f "$zip.blockmap"

            mount_dir="$(mktemp -d)"
            hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount_dir"
            verify_app "$(find "$mount_dir" -maxdepth 1 -name '*.app' -print -quit)"
            hdiutil detach "$mount_dir"

            unzip_dir="$(mktemp -d)"
            ditto -x -k "$zip" "$unzip_dir"
            verify_app "$(find "$unzip_dir" -maxdepth 1 -name '*.app' -print -quit)"
          done

          test -f artifacts/mc-school-studio-desktop/dist/release/latest-mac.yml

      - name: Stage verified macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-mac
          if-no-files-found: error
          path: |
            artifacts/mc-school-studio-desktop/dist/release/*.dmg
            artifacts/mc-school-studio-desktop/dist/release/*.zip
            artifacts/mc-school-studio-desktop/dist/release/latest-mac.yml
            artifacts/mc-school-studio-desktop/dist/release/*.blockmap

  # ---------------------------------------------------------------------------
  # Windows — produces a signed NSIS .exe installer for x64 computers.
  # ---------------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release tag matches app version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "const fs=require('fs'); const tag=process.env.RELEASE_TAG; const version=JSON.parse(fs.readFileSync('artifacts/mc-school-studio-desktop/package.json','utf8')).version; if(tag !== 'v'+version){console.error('Release tag '+tag+' must match desktop package version v'+version);process.exit(1)}"

      - name: Verify Windows signing credentials
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          $requiredSecrets = @("WIN_CSC_LINK", "WIN_CSC_KEY_PASSWORD")
          $missing = $requiredSecrets | Where-Object {
            [string]::IsNullOrWhiteSpace(
              [Environment]::GetEnvironmentVariable($_)
            )
          }

          if ($missing) {
            Write-Error (
              "Tagged Windows releases require signing secrets: " +
              ($missing -join ", ")
            )
            exit 1
          }

      - name: Decode Windows signing certificate
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
        run: |
          $certificatePath = Join-Path `
            $env:RUNNER_TEMP `
            "windows-signing-certificate.pfx"
          $certificate = [Convert]::FromBase64String($env:WIN_CSC_LINK)

          if ($certificate.Length -eq 0) {
            Write-Error "WIN_CSC_LINK did not decode to a certificate file"
            exit 1
          }

          [IO.File]::WriteAllBytes($certificatePath, $certificate)
          "WIN_CSC_LINK=$certificatePath" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Strip Replit-only platform overrides
        run: node scripts/strip-replit-overrides.mjs

      - name: Install dependencies
        # --no-frozen-lockfile because we modified pnpm-workspace.yaml above;
        # the lockfile generated on Linux does not include win32 entries.
        run: pnpm install --no-frozen-lockfile

      - name: Build & package Windows installer
        run: pnpm --filter @workspace/mc-school-studio-desktop run dist:win
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Verify Windows installer signature
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart("v")
          $releaseDirectory = "artifacts/mc-school-studio-desktop/dist/release"
          $installer = Join-Path `
            $releaseDirectory `
            "mc-school-studio-$version-setup.exe"

          if (-not (Test-Path $installer)) {
            Write-Error "Expected Windows installer was not produced: $installer"
            exit 1
          }

          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne "Valid") {
            Write-Error (
              "$installer does not have a valid Authenticode signature: " +
              "$($signature.Status)"
            )
            exit 1
          }

          foreach ($requiredFile in @(
            "$installer.blockmap",
            (Join-Path $releaseDirectory "latest.yml")
          )) {
            if (-not (Test-Path $requiredFile)) {
              Write-Error "Expected Windows update asset was not produced: $requiredFile"
              exit 1
            }
          }

      - name: Stage verified Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-windows
          if-no-files-found: error
          path: |
            artifacts/mc-school-studio-desktop/dist/release/*.exe
            artifacts/mc-school-studio-desktop/dist/release/latest.yml
            artifacts/mc-school-studio-desktop/dist/release/*.blockmap

  publish-release:
    needs:
      - build-mac
      - build-windows
    runs-on: ubuntu-latest

    steps:
      - name: Download verified packages
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-release-*
          path: release
          merge-multiple: true

      - name: Verify staged electron-updater assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"

          VERSION="$version" node <<'NODE'
          const fs = require('fs')
          const version = process.env.VERSION
          const names = new Set(fs.readdirSync('release'))
          const expected = [
            'latest-mac.yml',
            'latest.yml',
            `mc-school-studio-${version}-arm64.dmg`,
            `mc-school-studio-${version}-arm64.dmg.blockmap`,
            `mc-school-studio-${version}-arm64.zip`,
            `mc-school-studio-${version}-arm64.zip.blockmap`,
            `mc-school-studio-${version}-x64.dmg`,
            `mc-school-studio-${version}-x64.dmg.blockmap`,
            `mc-school-studio-${version}-x64.zip`,
            `mc-school-studio-${version}-x64.zip.blockmap`,
            `mc-school-studio-${version}-setup.exe`,
            `mc-school-studio-${version}-setup.exe.blockmap`,
          ]
          const missing = expected.filter((name) => !names.has(name))
          const unexpected = [...names].filter((name) => !expected.includes(name))

          if (missing.length > 0 || unexpected.length > 0) {
            console.error(`Missing release assets: ${missing.join(', ')}`)
            console.error(`Unexpected release assets: ${unexpected.join(', ')}`)
            process.exit(1)
          }

          const macMetadata = fs.readFileSync('release/latest-mac.yml', 'utf8')
          const windowsMetadata = fs.readFileSync('release/latest.yml', 'utf8')
          for (const arch of ['arm64', 'x64']) {
            const zip = `mc-school-studio-${version}-${arch}.zip`
            if (!macMetadata.includes(zip)) {
              console.error(`latest-mac.yml does not reference ${zip}`)
              process.exit(1)
            }
          }
          const exe = `mc-school-studio-${version}-setup.exe`
          if (!windowsMetadata.includes(exe)) {
            console.error(`latest.yml does not reference ${exe}`)
            process.exit(1)
          }

          console.log(`Verified ${expected.length} desktop release assets.`)
          NODE

      - name: Upload complete release as draft
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          draft: true
          files: release/*

      - name: Verify uploaded assets and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          expected="$(find release -maxdepth 1 -type f -printf '%f\n' | sort)"
          uploaded="$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' | sort)"

          if [ "$uploaded" != "$expected" ]; then
            echo "::error::Uploaded release assets do not match the verified staging directory"
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$uploaded") || true
            exit 1
          fi

          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest
