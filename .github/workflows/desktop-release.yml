# Builds signed and notarized macOS desktop packages on every `v*` tag push
# and attaches them to the GitHub Release.
#
# Trigger: git tag v1.2.3 && git push origin v1.2.3
#
# Note: pnpm-workspace.yaml contains overrides that exclude non-Linux platform
# binaries so they are not installed inside the Replit environment. This
# workflow strips those Replit-only overrides before running `pnpm install` so
# that the correct native binaries are fetched for the macOS runner.

name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      candidate_version:
        description: Stable desktop version to build without publishing
        required: true
        type: string
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Metadata — validates the updater contract on reviews and branch pushes
  # without requiring a macOS runner, signing credentials, or a release.
  #
  # Branch protection must require the stable check:
  # "Desktop Release / Updater metadata validation"
  # Keep this workflow name and job name stable when updating protected branches.
  # ---------------------------------------------------------------------------
  test-updater-metadata:
    name: Updater metadata validation
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test electron-updater metadata contract
        run: pnpm --filter @workspace/mc-school-studio-desktop run test:updater

  # ---------------------------------------------------------------------------
  # Capture integrity — rejects valid-but-uniform blank JPEGs while retaining
  # genuinely dark photographs. This gate runs before any desktop packaging.
  # ---------------------------------------------------------------------------
  test-capture-integrity:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test blank portrait protection
        run: pnpm --filter @workspace/mc-school-studio-desktop run test:blank-portrait

  # ---------------------------------------------------------------------------
  # Release history — only package source that is already reachable from main.
  # This prevents tags on release-only commits from creating a second history
  # that later has to be reconciled or force-pushed.
  # ---------------------------------------------------------------------------
  verify-release-history:
    name: Release history validation
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch main
        # Fetch the fully qualified branch and replace any tracking ref left by
        # checkout. A stale local origin/main must never become the ancestry
        # authority for a tagged release.
        run: git fetch --no-tags --force origin refs/heads/main:refs/remotes/origin/main

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify release commit is reachable from main
        env:
          RELEASE_REF: ${{ github.sha }}
          MAIN_REF: refs/remotes/origin/main
        run: pnpm --filter @workspace/mc-school-studio-desktop run check:release-history

  # ---------------------------------------------------------------------------
  # macOS — produces separate installers for Intel and Apple silicon Macs.
  # ---------------------------------------------------------------------------
  build-mac:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'
    needs: [test-capture-integrity, verify-release-history]
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: macos-15-intel
            runner_architecture: x86_64
          - architecture: arm64
            runner: macos-14
            runner_architecture: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify native build runner architecture
        env:
          EXPECTED_RUNNER_ARCHITECTURE: ${{ matrix.runner_architecture }}
        run: |
          set -euo pipefail
          uname -a
          test "$(uname -m)" = "$EXPECTED_RUNNER_ARCHITECTURE"

      - name: Verify requested version matches app version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.ref_name }}
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
        run: |
          node <<'NODE'
          const fs = require('fs')
          const eventName = process.env.EVENT_NAME
          const tag = process.env.RELEASE_TAG
          const candidateVersion = process.env.CANDIDATE_VERSION
          const packageVersion = JSON.parse(
            fs.readFileSync('artifacts/mc-school-studio-desktop/package.json', 'utf8'),
          ).version
          const stableVersion = /^\d+\.\d+\.\d+$/

          if (!stableVersion.test(packageVersion)) {
            throw new Error(`Desktop package version ${packageVersion} is not stable semver`)
          }
          if (eventName === 'workflow_dispatch') {
            if (!stableVersion.test(candidateVersion) || candidateVersion !== packageVersion) {
              throw new Error(
                `Candidate version ${candidateVersion} must match desktop package version ${packageVersion}`,
              )
            }
          } else if (!/^v\d+\.\d+\.\d+$/.test(tag) || tag !== `v${packageVersion}`) {
            throw new Error(
              `Release tag ${tag} must match desktop package version v${packageVersion}`,
            )
          }
          NODE

      - name: Verify macOS signing credentials
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for secret_name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!secret_name:-}" ]; then
              missing+=("$secret_name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Tagged macOS releases require signing and notarization secrets: ${missing[*]}"
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Test electron-updater metadata contract
        run: pnpm --filter @workspace/mc-school-studio-desktop run test:updater

      - name: Decode macOS signing certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')

          const encoded = process.env.CSC_LINK?.trim() ?? ''
          if (
            encoded.length === 0 ||
            !/^[A-Za-z0-9+/]+={0,2}$/.test(encoded) ||
            encoded.length % 4 === 1
          ) {
            throw new Error('CSC_LINK is not valid base64')
          }

          const certificate = Buffer.from(encoded, 'base64')
          // A PKCS#12 certificate is a DER-encoded ASN.1 SEQUENCE. Buffer.from
          // silently ignores invalid base64 characters, so validate both the
          // input alphabet and the decoded container before invoking the
          // signing toolchain.
          if (certificate.length < 4 || certificate[0] !== 0x30) {
            throw new Error('CSC_LINK did not decode to a PKCS#12 certificate file')
          }

          const certificatePath = path.join(
            process.env.RUNNER_TEMP,
            'mac-signing-certificate.p12',
          )
          fs.writeFileSync(
            certificatePath,
            certificate,
            { mode: 0o600 },
          )
          fs.chmodSync(certificatePath, 0o600)
          NODE
          echo "CSC_LINK=$RUNNER_TEMP/mac-signing-certificate.p12" >> "$GITHUB_ENV"

      - name: Strip Replit-only platform overrides
        run: node scripts/strip-replit-overrides.mjs

      - name: Install dependencies
        # --no-frozen-lockfile because we modified pnpm-workspace.yaml above;
        # the lockfile was generated on Linux and does not include darwin entries.
        run: pnpm install --no-frozen-lockfile

      - name: Diagnose pnpm Sharp virtual-store layout
        run: |
          set -euo pipefail
          sharp_path="$(realpath artifacts/mc-school-studio-desktop/node_modules/sharp)"
          sharp_img_directory="$(dirname "$sharp_path")/@img"
          virtual_store_directory="$(dirname "$(dirname "$(dirname "$sharp_path")")")"
          test -d "$sharp_img_directory"
          test "$(basename "$virtual_store_directory")" = ".pnpm"
          echo "Resolved Sharp: $sharp_path"
          echo "Resolved Sharp optional dependencies: $sharp_img_directory"
          echo "Resolved pnpm virtual store: $virtual_store_directory"
          SHARP_IMG_DIRECTORY="$sharp_img_directory" node <<'NODE'
          const fs = require('fs')
          const path = require('path')
          const directory = process.env.SHARP_IMG_DIRECTORY
          for (const name of fs.readdirSync(directory).sort()) {
            const entry = path.join(directory, name)
            let target = ''
            try {
              target = fs.readlinkSync(entry)
            } catch {}
            console.log(`${name} -> ${target}`)
          }
          NODE

      - name: Prune incompatible Sharp native packages
        env:
          PACKAGE_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          pnpm --filter @workspace/mc-school-studio-desktop run prune:mac-native -- \
            "$PACKAGE_ARCHITECTURE"

      - name: Build & package native macOS DMG
        env:
          PACKAGE_ARCHITECTURE: ${{ matrix.architecture }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: "true"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm --filter @workspace/mc-school-studio-desktop run "dist:mac:${PACKAGE_ARCHITECTURE}"

      - name: Set up Node.js for retirement release checks
        uses: actions/setup-node@v4
        with:
          # Node 22 provides native TypeScript type stripping for the Team
          # contract test and the WebSocket client used by the packaged smoke.
          node-version: 22

      - name: Verify Team retirement status and limitation copy
        run: |
          pnpm run typecheck:libs
          pnpm --filter @workspace/mc-school-studio run typecheck
          pnpm --filter @workspace/mc-school-studio-desktop run test:retirement-copy

      - name: Verify macOS packages are signed and notarized
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_version || github.ref_name }}
          PACKAGE_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"

          verify_app() {
            app_path="$1"

            if [ -z "$app_path" ]; then
              echo "::error::No app bundle found"
              exit 1
            fi

            test -d "$app_path/Contents/MacOS"
            executable_count="$(find "$app_path/Contents/MacOS" -maxdepth 1 -type f | wc -l | tr -d ' ')"
            test "$executable_count" = "1"
            executable="$(find "$app_path/Contents/MacOS" -maxdepth 1 -type f -print -quit)"
            expected_macho_architecture="$PACKAGE_ARCHITECTURE"
            if [ "$expected_macho_architecture" = "x64" ]; then
              expected_macho_architecture="x86_64"
            fi
            test "$(lipo -archs "$executable")" = "$expected_macho_architecture"
            codesign --verify --deep --strict --verbose=2 "$app_path"
            spctl --assess --type execute --verbose=2 "$app_path"
            xcrun stapler validate "$app_path"
          }

          for arch in "$PACKAGE_ARCHITECTURE"; do
            dmg="artifacts/mc-school-studio-desktop/dist/release/mc-school-studio-${version}-${arch}.dmg"
            zip="artifacts/mc-school-studio-desktop/dist/release/mc-school-studio-${version}-${arch}.zip"
            test -f "$dmg"
            test -f "$dmg.blockmap"
            test -f "$zip"
            test -f "$zip.blockmap"

            mount_dir="$(mktemp -d)"
            hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount_dir"
            verify_app "$(find "$mount_dir" -maxdepth 1 -name '*.app' -print -quit)"
            hdiutil detach "$mount_dir"

            unzip_dir="$(mktemp -d)"
            ditto -x -k "$zip" "$unzip_dir"
            verify_app "$(find "$unzip_dir" -maxdepth 1 -name '*.app' -print -quit)"
          done

      - name: Stage verified macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-mac-${{ matrix.architecture }}
          if-no-files-found: error
          path: |
            artifacts/mc-school-studio-desktop/dist/release/*.dmg
            artifacts/mc-school-studio-desktop/dist/release/*.zip
            artifacts/mc-school-studio-desktop/dist/release/*.blockmap

  combine-mac:
    needs: build-mac
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout updater tools
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Download native macOS packages
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-release-mac-*
          merge-multiple: true
          path: release

      - name: Merge and validate electron-updater metadata
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_version || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          pnpm --filter @workspace/mc-school-studio-desktop run merge:mac-updater \
            "$GITHUB_WORKSPACE/release" "$version"
          pnpm --filter @workspace/mc-school-studio-desktop run validate:updater \
            "$GITHUB_WORKSPACE/release/latest-mac.yml" "$version"

      - name: Stage complete macOS release
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-mac
          if-no-files-found: error
          path: release/*

  # ---------------------------------------------------------------------------
  # Retirement smoke — runs each signed architecture on its matching native
  # hosted runner. Publication is blocked until both checks pass.
  # ---------------------------------------------------------------------------
  retirement-smoke:
    needs: combine-mac
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: macos-15-intel
            runner_architecture: x86_64
          - architecture: arm64
            runner: macos-14
            runner_architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout smoke harness
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install smoke harness dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify native runner architecture
        env:
          EXPECTED_RUNNER_ARCHITECTURE: ${{ matrix.runner_architecture }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$EXPECTED_RUNNER_ARCHITECTURE"

      - name: Download verified macOS packages
        uses: actions/download-artifact@v4
        with:
          name: desktop-release-mac
          path: release

      - name: Exercise retirement reconnect in packaged signed app
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_version || github.ref_name }}
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          smoke_dir="$(mktemp -d)"
          ditto -x -k \
            "release/mc-school-studio-${version}-${EXPECTED_ARCHITECTURE}.zip" \
            "$smoke_dir"
          app_path="$(find "$smoke_dir" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app_path"
          MC_SCHOOL_STUDIO_APP_PATH="$app_path/Contents/MacOS/Volume Capture" \
            MC_SCHOOL_STUDIO_EXPECTED_ARCH="$EXPECTED_ARCHITECTURE" \
            pnpm --filter @workspace/mc-school-studio-desktop run test:retirement-release

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [combine-mac, retirement-smoke]
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Download verified packages
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-release-*
          path: release
          merge-multiple: true

      - name: Verify staged electron-updater assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"

          VERSION="$version" node <<'NODE'
          const fs = require('fs')
          const version = process.env.VERSION
          const names = new Set(fs.readdirSync('release'))
          const expected = [
            'latest-mac.yml',
            `mc-school-studio-${version}-arm64.dmg`,
            `mc-school-studio-${version}-arm64.dmg.blockmap`,
            `mc-school-studio-${version}-arm64.zip`,
            `mc-school-studio-${version}-arm64.zip.blockmap`,
            `mc-school-studio-${version}-x64.dmg`,
            `mc-school-studio-${version}-x64.dmg.blockmap`,
            `mc-school-studio-${version}-x64.zip`,
            `mc-school-studio-${version}-x64.zip.blockmap`,
          ]
          const missing = expected.filter((name) => !names.has(name))
          const unexpected = [...names].filter((name) => !expected.includes(name))

          if (missing.length > 0 || unexpected.length > 0) {
            console.error(`Missing release assets: ${missing.join(', ')}`)
            console.error(`Unexpected release assets: ${unexpected.join(', ')}`)
            process.exit(1)
          }

          const macMetadata = fs.readFileSync('release/latest-mac.yml', 'utf8')
          for (const arch of ['arm64', 'x64']) {
            const zip = `mc-school-studio-${version}-${arch}.zip`
            if (!macMetadata.includes(zip)) {
              console.error(`latest-mac.yml does not reference ${zip}`)
              process.exit(1)
            }
          }

          console.log(`Verified ${expected.length} desktop release assets.`)
          NODE

      - name: Upload complete release as draft
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          draft: true
          files: release/*

      - name: Verify uploaded assets and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          expected="$(find release -maxdepth 1 -type f -printf '%f\n' | sort)"
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets > "$RUNNER_TEMP/uploaded-release-assets.json"
          uploaded="$(node -e "const fs=require('fs'); const value=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); process.stdout.write(value.assets.map(asset=>asset.name).sort().join('\\n'))" "$RUNNER_TEMP/uploaded-release-assets.json")"

          if [ "$uploaded" != "$expected" ]; then
            echo "::error::Uploaded release assets do not match the verified staging directory"
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$uploaded") || true
            exit 1
          fi

          VERSION="${RELEASE_TAG#v}" UPLOADED_ASSETS="$RUNNER_TEMP/uploaded-release-assets.json" node <<'NODE'
          const { createHash } = require('crypto')
          const fs = require('fs')
          const path = require('path')

          const uploaded = JSON.parse(fs.readFileSync(process.env.UPLOADED_ASSETS, 'utf8')).assets
          const byName = new Map(uploaded.map((asset) => [asset.name, asset]))
          const stagedNames = fs.readdirSync('release')
          for (const name of stagedNames) {
            const filePath = path.join('release', name)
            const stat = fs.statSync(filePath)
            if (!stat.isFile()) throw new Error(`staging directory contains a non-file: ${name}`)
            const digest = `sha256:${createHash('sha256').update(fs.readFileSync(filePath)).digest('hex')}`
            const asset = byName.get(name)
            if (!asset || asset.size !== stat.size || asset.digest !== digest) {
              throw new Error(`uploaded asset ${name} does not match the verified staged bytes`)
            }
          }
          console.log(`Verified uploaded SHA-256 digests for ${stagedNames.length} assets.`)
          NODE

          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest

  # ---------------------------------------------------------------------------
  # Update smoke — installs the previous signed release and exercises its
  # native electron-updater flow against the release published above.
  # These jobs intentionally run after publish-release and do not stage or
  # publish release assets.
  # ---------------------------------------------------------------------------
  update-smoke-intel:
    needs: publish-release
    runs-on: macos-15-intel
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout smoke harness
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Verify Intel runner
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"

      - name: Resolve previous signed release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_list="$RUNNER_TEMP/mc-school-studio-releases.json"
          gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 100 \
            --json tagName,isDraft,isPrerelease > "$release_list"
          previous_tag="$(node artifacts/mc-school-studio-desktop/scripts/resolve-previous-release.mjs \
            "$TARGET_TAG" "$release_list")"
          test -n "$previous_tag"
          previous_version="${previous_tag#v}"
          echo "MC_SCHOOL_STUDIO_SOURCE_VERSION=$previous_version" >> "$GITHUB_ENV"
          echo "Resolved signed update source: $previous_tag"

      - name: Download and install previous signed Intel release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/mc-school-studio-source.zip"
          gh release download "v$MC_SCHOOL_STUDIO_SOURCE_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "mc-school-studio-$MC_SCHOOL_STUDIO_SOURCE_VERSION-x64.zip" \
            --output "$archive"
          mkdir -p "$RUNNER_TEMP/mc-school-studio-source"
          ditto -x -k "$archive" "$RUNNER_TEMP/mc-school-studio-source"
          app_path="$(find "$RUNNER_TEMP/mc-school-studio-source" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app_path"
          echo "MC_SCHOOL_STUDIO_APP_PATH=$app_path" >> "$GITHUB_ENV"
          echo "Installed source bundle: $app_path"

      - name: Exercise signed Intel update and restart
        env:
          MC_SCHOOL_STUDIO_TARGET_VERSION: ${{ github.ref_name }}
          MC_SCHOOL_STUDIO_UPDATE_SMOKE_LOG: ${{ runner.temp }}/mc-school-studio-update-smoke/lifecycle.jsonl
        run: |
          set -euo pipefail
          export MC_SCHOOL_STUDIO_TARGET_VERSION="${MC_SCHOOL_STUDIO_TARGET_VERSION#v}"
          pnpm --filter @workspace/mc-school-studio-desktop run test:update-release

      - name: Upload Intel updater lifecycle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-update-smoke-intel
          if-no-files-found: warn
          path: ${{ runner.temp }}/mc-school-studio-update-smoke/lifecycle.jsonl

  update-smoke-arm64:
    needs: publish-release
    runs-on: macos-14
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout smoke harness
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Verify Apple silicon runner
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"

      - name: Resolve previous signed release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_list="$RUNNER_TEMP/mc-school-studio-releases.json"
          gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 100 \
            --json tagName,isDraft,isPrerelease > "$release_list"
          previous_tag="$(node artifacts/mc-school-studio-desktop/scripts/resolve-previous-release.mjs \
            "$TARGET_TAG" "$release_list")"
          test -n "$previous_tag"
          previous_version="${previous_tag#v}"
          echo "MC_SCHOOL_STUDIO_SOURCE_VERSION=$previous_version" >> "$GITHUB_ENV"
          echo "Resolved signed update source: $previous_tag"

      - name: Download and install previous signed Apple-silicon release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/mc-school-studio-source.zip"
          gh release download "v$MC_SCHOOL_STUDIO_SOURCE_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "mc-school-studio-$MC_SCHOOL_STUDIO_SOURCE_VERSION-arm64.zip" \
            --output "$archive"
          mkdir -p "$RUNNER_TEMP/mc-school-studio-source"
          ditto -x -k "$archive" "$RUNNER_TEMP/mc-school-studio-source"
          app_path="$(find "$RUNNER_TEMP/mc-school-studio-source" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app_path"
          echo "MC_SCHOOL_STUDIO_APP_PATH=$app_path" >> "$GITHUB_ENV"
          echo "Installed source bundle: $app_path"

      - name: Exercise signed Apple-silicon update and restart
        env:
          MC_SCHOOL_STUDIO_TARGET_VERSION: ${{ github.ref_name }}
          MC_SCHOOL_STUDIO_UPDATE_SMOKE_LOG: ${{ runner.temp }}/mc-school-studio-update-smoke/lifecycle.jsonl
        run: |
          set -euo pipefail
          export MC_SCHOOL_STUDIO_TARGET_VERSION="${MC_SCHOOL_STUDIO_TARGET_VERSION#v}"
          pnpm --filter @workspace/mc-school-studio-desktop run test:update-release

      - name: Upload Apple-silicon updater lifecycle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-update-smoke-arm64
          if-no-files-found: warn
          path: ${{ runner.temp }}/mc-school-studio-update-smoke/lifecycle.jsonl
