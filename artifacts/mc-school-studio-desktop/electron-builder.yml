appId: com.mcschoolstudio.desktop
productName: MC School Studio
copyright: Copyright © 2025 MC School Studio

directories:
  buildResources: build
  output: dist/release

artifactName: mc-school-studio-${version}-${arch}.${ext}

extraMetadata:
  name: mc-school-studio

publish:
  provider: github
  owner: mahdichafik-ship-it
  repo: mc-dchool-studio
  releaseType: release

files:
  - out/**/*
  - node_modules/**/*
  - package.json

asarUnpack:
  - resources/**
  - node_modules/better-sqlite3/**/*
  # Native libvips and ExifTool must be runnable outside the ASAR archive.
  - node_modules/sharp/**/*
  - node_modules/@img/**/*
  - "**/node_modules/exiftool-vendored.{pl,exe}/**/*"

mac:
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  hardenedRuntime: true
  extendInfo:
    NSDocumentsFolderUsageDescription: Required to store photo data.
    NSDownloadsFolderUsageDescription: Required to import project files.
  notarize: true
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64

dmg:
  # The x64 and arm64 builds run in parallel, so their filenames must differ.
  artifactName: ${name}-${version}-${arch}.${ext}

linux:
  target:
    - AppImage
    - snap
  maintainer: electronjs.org
  category: Photography

appImage:
  artifactName: ${name}-${version}.${ext}
