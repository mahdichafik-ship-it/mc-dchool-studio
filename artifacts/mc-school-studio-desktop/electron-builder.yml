appId: com.mcschoolstudio.desktop
productName: MC School Studio
copyright: Copyright © 2025 MC School Studio

directories:
  buildResources: build
  output: dist/release

artifactName: mc-school-studio-${version}-${arch}.${ext}

extraMetadata:
  name: mc-school-studio

files:
  - out/**/*
  - node_modules/**/*
  - package.json

asarUnpack:
  - resources/**
  - node_modules/better-sqlite3/**/*

win:
  executableName: mc-school-studio
  target:
    - target: nsis
      arch:
        - x64

nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always

mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Required to store photo data.
    - NSDownloadsFolderUsageDescription: Required to import project files.
  notarize: false
  target:
    - target: dmg
      arch:
        - x64
        - arm64

dmg:
  # The x64 and arm64 builds run in parallel, so their filenames must differ.
  artifactName: ${name}-${version}-${arch}.${ext}

linux:
  target:
    - AppImage
    - snap
  maintainer: electronjs.org
  category: Photography

appImage:
  artifactName: ${name}-${version}.${ext}
