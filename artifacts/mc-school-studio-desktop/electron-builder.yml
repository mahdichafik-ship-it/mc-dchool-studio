appId: com.mcschoolstudio.desktop
productName: Volume Capture
copyright: Copyright © 2026 Volume Capture

directories:
  buildResources: build
  output: dist/release

artifactName: mc-school-studio-${version}-${arch}.${ext}

extraMetadata:
  name: mc-school-studio

publish:
  provider: github
  owner: mahdichafik-ship-it
  repo: mc-dchool-studio
  releaseType: release

files:
  - out/**/*
  - node_modules/**/*
  - package.json

asarUnpack:
  - resources/**
  - node_modules/better-sqlite3/**/*
  # Native libvips and ExifTool must be runnable outside the ASAR archive.
  - node_modules/sharp/**/*
  - node_modules/@img/**/*
  - "**/node_modules/exiftool-vendored.{pl,exe}/**/*"

mac:
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  hardenedRuntime: true
  extendInfo:
    NSDocumentsFolderUsageDescription: Required to store photo data.
    NSDownloadsFolderUsageDescription: Required to import project files.
  notarize: true
  # Each release-matrix job supplies exactly one architecture on the CLI.
  # Do not list architectures here or every native runner will build both.
  target:
    - dmg
    - zip

dmg:
  # The x64 and arm64 builds run in parallel, so their filenames must differ.
  artifactName: ${name}-${version}-${arch}.${ext}

linux:
  target:
    - AppImage
    - snap
  maintainer: electronjs.org
  category: Photography

appImage:
  artifactName: ${name}-${version}.${ext}
