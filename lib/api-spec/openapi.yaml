      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PaymentStatusInput" } } }
      responses: { "200": { description: Updated payment status, content: { application/json: { schema: { $ref: "#/components/schemas/DeliveryOrderMutationResponse" } } } } }
  /projects/{projectId}/delivery/orders/export.csv:
    get:
      operationId: exportDeliveryOrders
      tags: [delivery]
      parameters: [{ name: projectId, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: CSV, content: { text/csv: { schema: { type: string } } } } }

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    DesktopReleaseAsset:
      type: object
      additionalProperties: false
      required: [url, size]
      properties:
        url:
          type: string
        size:
          type: integer
          minimum: 1

    DesktopReleaseArchitecture:
      type: object
      additionalProperties: false
      required: [displayName, asset]
      properties:
        displayName:
          type: string
        asset:
          $ref: "#/components/schemas/DesktopReleaseAsset"

    DesktopRelease:
      type: object
      additionalProperties: false
      required: [version, publishedAt, releasePage, platforms, architectures]
      properties:
        version:
          type: string
          pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
        publishedAt:
          type: string
          format: date-time
        releasePage:
          type: string
        platforms:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [macos]
        architectures:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            arm64:
              $ref: "#/components/schemas/DesktopReleaseArchitecture"
            x64:
              $ref: "#/components/schemas/DesktopReleaseArchitecture"

    DashboardStats:
      type: object
      required: [totalProjects, totalSchools, totalClasses, totalStudents]
      properties:
        totalProjects:
          type: integer
        totalSchools:
          type: integer
        totalClasses:
          type: integer
        totalStudents:
          type: integer

    Project:
      type: object
      required: [id, projectType, schoolName, createdAt, updatedAt, classCount, studentCount]
      properties:
        id:
          type: integer
        projectType:
          type: string
          enum: [school, corporate]
        schoolName:
          type: string
        photoDate:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        contactName:
          type: ["string", "null"]
        contactEmail:
          type: ["string", "null"]
        contactPhone:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        priceSheetId:
          type: ["integer", "null"]
        classCount:
          type: integer
        studentCount:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string

    ProjectInput:
      type: object
      required: [schoolName, priceSheetId]
      properties:
        projectType:
          type: string
          enum: [school, corporate]
          default: school
        schoolName:
          type: string
          minLength: 1
        photoDate:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        contactName:
          type: ["string", "null"]
        contactEmail:
          type: ["string", "null"]
        contactPhone:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        priceSheetId:
          type: integer

    ProjectPatch:
      type: object
      properties:
        projectType:
          type: string
          enum: [school, corporate]
        schoolName:
          type: string
          minLength: 1
        photoDate:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        contactName:
          type: ["string", "null"]
        contactEmail:
          type: ["string", "null"]
        contactPhone:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    Class:
      type: object
      required: [id, projectId, className, studentCount, createdAt, updatedAt]
      properties:
        id:
          type: integer
        projectId:
          type: integer
        className:
          type: string
        studentCount:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string

    ClassInput:
      type: object
      required: [className]
      properties:
        className:
          type: string
          minLength: 1

    ClassPatch:
      type: object
      required: [className]
      properties:
        className:
          type: string
          minLength: 1

    Student:
      type: object
      required: [id, projectId, classId, className, firstName, lastName, generatedStudentId, createdAt, updatedAt]
      properties:
        id:
          type: integer
        projectId:
          type: integer
        classId:
          type: integer
        className:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        generatedStudentId:
          type: string
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        secondaryEmail:
          type: ["string", "null"]
        jobTitle:
          type: ["string", "null"]
        officeLocation:
          type: ["string", "null"]
        photoSession:
          type: ["string", "null"]
        simpleQr:
          type: ["string", "null"]
        jsonQr:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    StudentInput:
      type: object
      required: [classId, firstName, lastName]
      properties:
        classId:
          type: integer
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        generatedStudentId:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        secondaryEmail:
          type: ["string", "null"]
        jobTitle:
          type: ["string", "null"]
        officeLocation:
          type: ["string", "null"]
        photoSession:
          type: ["string", "null"]

    StudentPatch:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        generatedStudentId:
          type: ["string", "null"]
        classId:
          type: integer
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        secondaryEmail:
          type: ["string", "null"]
        jobTitle:
          type: ["string", "null"]
        officeLocation:
          type: ["string", "null"]
        photoSession:
          type: ["string", "null"]

    BulkStudentIds:
      type: object
      required: [studentIds]
      properties:
        studentIds:
          type: array
          items:
            type: integer

    BulkDeleteResult:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: integer

    GenerateQrRequest:
      type: object
      properties:
        studentIds:
          type: array
          items:
            type: integer
          description: If omitted, generates QR codes for all students in the project

    GenerateQrResult:
      type: object
      required: [generated]
      properties:
        generated:
          type: integer

    ParseResult:
      type: object
      required: [sheets]
      properties:
        sheets:
          type: array
          items:
            $ref: "#/components/schemas/SheetPreview"

    SheetPreview:
      type: object
      required: [name, headers, rows]
      properties:
        name:
          type: string
        headers:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: array
            items:
              type: string

    ImportConfirmation:
      type: object
      required: [sheets]
      properties:
        sheets:
          type: array
          items:
            $ref: "#/components/schemas/SheetMapping"

    SheetMapping:
      type: object
      required: [sheetName, className, firstNameColumn, lastNameColumn, rows]
      properties:
        sheetName:
          type: string
        className:
          type: string
        firstNameColumn:
          type: string
        lastNameColumn:
          type: string
        studentIdColumn:
          type: ["string", "null"]
        emailColumn:
          type: ["string", "null"]
        phoneColumn:
          type: ["string", "null"]
        secondaryEmailColumn:
          type: ["string", "null"]
        jobTitleColumn:
          type: ["string", "null"]
        officeLocationColumn:
          type: ["string", "null"]
        photoSessionColumn:
          type: ["string", "null"]
        rows:
          type: array
          items:
            type: array
            items:
              type: string
        headers:
          type: array
          items:
            type: string

    ImportResult:
      type: object
      required: [classesCreated, studentsCreated, studentsUpdated, studentsMoved, studentsSkipped, conflicts]
      properties:
        classesCreated:
          type: integer
          description: Classes created; existing classes are reused case-insensitively.
        studentsCreated:
          type: integer
          description: Students or employees created.
        studentsUpdated:
          type: integer
          description: Existing students or employees whose roster details changed.
        studentsMoved:
          type: integer
          description: Existing students or employees moved to another class or department.
        studentsSkipped:
          type: integer
          description: Unchanged rows skipped because they were already reconciled.
        conflicts:
          type: integer
          description: Ambiguous rows that were not merged.

    ImportFileForm:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: Excel (.xlsx) or CSV (.csv) file
        csvClassName:
          type: string
          description: Required only for CSV files — the class name to assign

    Group:
      type: object
      required: [id, projectId, name, isDefaultClassGroup, members, createdAt, updatedAt]
      properties:
        id: { type: integer }
        projectId: { type: integer }
        classId: { type: [integer, "null"] }
        name: { type: string }
        isDefaultClassGroup: { type: boolean }
        members:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              groupId: { type: integer }
              studentId: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }

    GroupInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        classId: { type: [integer, "null"] }
        isDefaultClassGroup: { type: boolean }

    GroupPatch:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        classId: { type: [integer, "null"] }
        isDefaultClassGroup: { type: boolean }

    GroupMembersInput:
      type: object
      required: [studentIds]
      properties:
        studentIds:
          type: array
          items: { type: integer }

    Studio:
      type: object
      required: [id, name, createdByUserId, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        contactEmail:
          type: ["string", "null"]
        createdByUserId:
          type: string
        createdAt:
          type: string
          format: date-time

    StudioOnboardingInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        description:
          type: string
          maxLength: 500
        website:
          type: string
          maxLength: 200

    StudioUpdate:
      type: object
      properties:
        description:
          type: ["string", "null"]
          maxLength: 500
        website:
          type: ["string", "null"]
          maxLength: 200
        contactEmail:
          type: ["string", "null"]
          maxLength: 254

    PlatformInvite:
      type: object
      required: [id, email, code, invitedByUserId, status, createdAt]
      properties:
        id:
          type: integer
        email:
          type: string
        code:
          type: string
        invitedByUserId:
          type: string
        status:
          type: string
          enum: [pending, accepted, cancelled]
        acceptedByUserId:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        acceptedAt:
          type: ["string", "null"]
          format: date-time

    PlatformInviteInput:
      type: object
      required: [email]
      properties:
        email:
          type: string

    PlatformInvitePublic:
      type: object
      required: [email, status, createdAt]
      properties:
        email:
          type: string
        status:
          type: string
          enum: [pending, accepted, cancelled]
        createdAt:
          type: string
          format: date-time

    PlatformStudio:
      allOf:
        - $ref: "#/components/schemas/Studio"
        - type: object
          required: [memberCount, projectCount, owner]
          properties:
            memberCount:
              type: integer
            projectCount:
              type: integer
            owner:
              oneOf:
                - type: object
                  required: [userId, email]
                  properties:
                    userId:
                      type: string
                    email:
                      type: string
                    displayName:
                      type: ["string", "null"]
                - type: "null"

    PlatformProject:
      allOf:
        - $ref: "#/components/schemas/Project"
        - type: object
          required: [studioId, studioName]
          properties:
            studioId:
              type: ["integer", "null"]
            studioName:
              type: ["string", "null"]

    PlatformOverview:
      type: object
      required: [configured, studios, projects, invites]
      properties:
        configured:
          type: boolean
        studios:
          type: array
          items:
            $ref: "#/components/schemas/PlatformStudio"
        projects:
          type: array
          items:
            $ref: "#/components/schemas/PlatformProject"
        invites:
          type: array
          items:
            $ref: "#/components/schemas/PlatformInvite"

    DeliveryAccessInput:
      type: object
      required: [email, code]
      properties:
        code: { type: string, minLength: 8, maxLength: 8 }
        email: { type: string, maxLength: 254 }
        consentSource: { type: string, maxLength: 100 }
        marketingConsent:
          type: boolean
          description: Optional explicit consent to receive promotional email from the studio.
    MarketingContactResponse:
      type: object
      required: [id, studioId, email, firstSeenAt, lastSeenAt, successfulGalleryAccesses, marketingConsent, unsubscribedAt]
      properties:
        id: { type: integer }
        studioId: { type: integer }
        email: { type: string }
        firstSeenAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
