openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: MC School Studio API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Dashboard statistics
  - name: projects
    description: School project management
  - name: classes
    description: Class management within a project
  - name: students
    description: Student management within a project
  - name: groups
    description: Editable photo groups and memberships
  - name: import
    description: Student list import operations
  - name: export
    description: QR code export operations
  - name: platform
    description: Global platform-owner and studio-owner onboarding operations
  - name: marketing
    description: Consent-aware studio marketing contacts and campaign drafts
  - name: desktop
    description: Public desktop application distribution metadata

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /desktop/release:
    get:
      operationId: getDesktopRelease
      tags: [desktop]
      summary: Get the latest validated desktop release
      description: Returns independently validated macOS installer assets from the latest published GitHub release.
      responses:
        "200":
          description: Validated desktop release metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesktopRelease"
        "503":
          description: A current valid desktop release is unavailable

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard statistics
      description: Returns aggregate counts for projects, schools, classes, and students
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"
        "401":
          description: Unauthorized

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all projects
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "401":
          description: Unauthorized
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new school project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Validation error
        "401":
          description: Unauthorized

  /projects/{projectId}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project by ID
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          description: Unauthorized
        "404":
          description: Not found
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectPatch"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          description: Unauthorized
        "404":
          description: Not found
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project and all its data
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /projects/{projectId}/classes:
    get:
      operationId: listClasses
      tags: [classes]
      summary: List all classes in a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of classes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Class"
        "401":
          description: Unauthorized
    post:
      operationId: createClass
      tags: [classes]
      summary: Create a class in a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassInput"
      responses:
        "201":
          description: Created class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Class"
        "401":
          description: Unauthorized

  /projects/{projectId}/classes/{classId}:
    patch:
      operationId: updateClass
      tags: [classes]
      summary: Rename a class
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
        - name: classId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassPatch"
      responses:
        "200":
          description: Updated class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Class"
        "401":
          description: Unauthorized
        "404":
          description: Not found
    delete:
      operationId: deleteClass
      tags: [classes]
      summary: Delete a class and its students
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
        - name: classId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /projects/{projectId}/students:
    get:
      operationId: listStudents
      tags: [students]
      summary: List students in a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of students
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Student"
        "401":
          description: Unauthorized
    post:
      operationId: createStudent
      tags: [students]
      summary: Add a single student to a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentInput"
      responses:
        "201":
          description: Created student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
        "401":
          description: Unauthorized

  /projects/{projectId}/groups:
    get:
      operationId: listGroups
      tags: [groups]
      summary: List photo groups and members
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Groups
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Group" }
    post:
      operationId: createGroup
      tags: [groups]
      summary: Create a photo group
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupInput" }
      responses:
        "201":
          description: Created group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }

  /projects/{projectId}/groups/{groupId}:
    patch:
      operationId: updateGroup
      tags: [groups]
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: integer }
        - name: groupId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupPatch" }
      responses:
        "200":
          description: Updated group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
    delete:
      operationId: deleteGroup
      tags: [groups]
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: integer } }
        - { name: groupId, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }

  /projects/{projectId}/groups/{groupId}/members:
    put:
      operationId: replaceGroupMembers
      tags: [groups]
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: integer } }
        - { name: groupId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupMembersInput" }
      responses:
        "200": { description: Members replaced }
    post:
      operationId: addGroupMembers
      tags: [groups]
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: integer } }
        - { name: groupId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupMembersInput" }
      responses:
        "200": { description: Members added }
    delete:
      operationId: removeGroupMembers
      tags: [groups]
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: integer } }
        - { name: groupId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupMembersInput" }
      responses:
        "200": { description: Members removed }
  /projects/{projectId}/students/{studentId}:
    patch:
      operationId: updateStudent
      tags: [students]
      summary: Update a student record
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentPatch"
      responses:
        "200":
          description: Updated student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
        "401":
          description: Unauthorized
        "404":
          description: Not found
    delete:
      operationId: deleteStudent
      tags: [students]
      summary: Delete a student
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /projects/{projectId}/students/bulk-delete:
    post:
      operationId: bulkDeleteStudents
      tags: [students]
      summary: Delete multiple students
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkStudentIds"
      responses:
        "200":
          description: Deletion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkDeleteResult"
        "401":
          description: Unauthorized

  /projects/{projectId}/students/generate-qr:
    post:
      operationId: generateQrCodes
      tags: [students]
      summary: Generate QR codes for all students missing them
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateQrRequest"
      responses:
        "200":
          description: QR generation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateQrResult"
        "401":
          description: Unauthorized

  /projects/{projectId}/import/parse:
    post:
      operationId: parseImportFile
      tags: [import]
      summary: Upload and parse an Excel or CSV file, returns sheet/column preview
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ImportFileForm"
      responses:
        "200":
          description: Parse result with sheets and sample rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParseResult"
        "400":
          description: Invalid file
        "401":
          description: Unauthorized

  /projects/{projectId}/import/confirm:
    post:
      operationId: confirmImport
      tags: [import]
      summary: Confirm a project-scoped roster reconciliation
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportConfirmation"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          description: Validation error
        "401":
          description: Unauthorized

  /projects/{projectId}/export/zip:
    get:
      operationId: exportZip
      tags: [export]
      summary: Download a ZIP of QR code PNGs for all students
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: ZIP file
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /projects/{projectId}/export/pdf:
    get:
      operationId: exportPdf
      tags: [export]
      summary: Download a printable PDF with one student per page
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: PDF file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /platform:
    get:
      operationId: getPlatformOverview
      tags: [platform]
      summary: Get the platform-owner workspace
      responses:
        "200":
          description: Platform overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformOverview"
        "401":
          description: Unauthorized
        "403":
          description: Platform owner access required

  /platform/studios/{studioId}:
    patch:
      operationId: updatePlatformStudio
      tags: [platform]
      summary: Update studio details from the platform workspace
      parameters:
        - name: studioId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudioUpdate"
      responses:
        "200":
          description: Updated studio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Studio"
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Platform owner access required
        "404":
          description: Studio not found

  /platform/invites:
    post:
      operationId: createPlatformInvite
      tags: [platform]
      summary: Create a studio-owner invitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformInviteInput"
      responses:
        "201":
          description: Created invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformInvite"
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Platform owner access required
        "409":
          description: A pending invitation already exists

  /platform/invites/{inviteId}:
    patch:
      operationId: cancelPlatformInvite
      tags: [platform]
      summary: Cancel a pending studio-owner invitation
      parameters:
        - name: inviteId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cancelled invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformInvite"
        "401":
          description: Unauthorized
        "403":
          description: Platform owner access required
        "404":
          description: Pending invitation not found

  /platform/invites/{code}:
    get:
      operationId: getPlatformInvite
      tags: [platform]
      summary: Get public details for a studio-owner invitation
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invitation details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformInvitePublic"
        "404":
          description: Invitation not found

  /platform/invites/{code}/complete:
    post:
      operationId: completePlatformInvite
      tags: [platform]
      summary: Accept an invitation and create the studio owner's studio
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudioOnboardingInput"
      responses:
        "201":
          description: Created or completed studio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Studio"
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: The signed-in email does not match the invitation
        "404":
          description: Invitation not found
        "409":
          description: Invitation is no longer pending or the account belongs to another studio

  /delivery/{slug}:
    get:
      operationId: getDeliveryGallery
      tags: [delivery]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Delivery gallery, content: { application/json: { schema: { $ref: "#/components/schemas/DeliveryGallery" } } } }
        "404": { description: Not found }
  /projects/{projectId}/students/{studentId}/photos/{photoId}/share:
    patch:
      operationId: updatePhotoSharing
      tags: [projects]
      summary: Set whether a photo is shared with parents
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: integer } }
        - { name: studentId, in: path, required: true, schema: { type: integer } }
        - { name: photoId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PhotoShareInput" }
      responses:
        "200":
          description: Updated photo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhotoShareResponse" }
        "400": { description: Invalid parameters }
        "404": { description: Photo or project not found }
  /delivery/{slug}/access:
    post:
      operationId: enterDeliveryAccess
      tags: [delivery]
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DeliveryAccessInput" } } }
      responses: { "200": { description: Access token, content: { application/json: { schema: { $ref: "#/components/schemas/DeliveryAccessResponse" } } } }, "401": { description: Invalid access } }
  /marketing/overview:
    get:
      operationId: getMarketingOverview
      tags: [marketing]
      responses:
        "200": { description: Studio marketing metrics, content: { application/json: { schema: { $ref: "#/components/schemas/MarketingOverview" } } } }
        "401": { description: Unauthorized }
        "403": { description: Studio owner or admin required }
  /marketing/contacts:
    get:
      operationId: listMarketingContacts
      tags: [marketing]
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: engagement, in: query, schema: { type: string, enum: [all, visited, repeat, purchaser] } }
        - { name: consent, in: query, schema: { type: string, enum: [all, consented, unconsented] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200": { description: Contacts, content: { application/json: { schema: { $ref: "#/components/schemas/MarketingContactsResponse" } } } }
        "403": { description: Studio owner or admin required }
  /marketing/contacts/{contactId}/consent:
    patch:
      operationId: updateMarketingConsent
      tags: [marketing]
      parameters: [{ name: contactId, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MarketingConsentInput" } } }
      responses:
        "200": { description: Updated contact, content: { application/json: { schema: { $ref: "#/components/schemas/MarketingContactMutationResponse" } } } }
        "403": { description: Studio owner or admin required }
  /marketing/contacts/{contactId}/unsubscribe:
    post:
      operationId: unsubscribeMarketingContact
      tags: [marketing]
      parameters: [{ name: contactId, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: Unsubscribed contact, content: { application/json: { schema: { $ref: "#/components/schemas/MarketingContactMutationResponse" } } } }
        "403": { description: Studio owner or admin required }
  /marketing/templates:
    get:
      operationId: listMarketingTemplates
      tags: [marketing]
      responses:
        "200": { description: Studio templates, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/MarketingTemplate" } } } } }
    post:
      operationId: createMarketingTemplate
      tags: [marketing]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MarketingTemplateInput" } } }
      responses:
        "201": { description: Created template, content: { application/json: { schema: { $ref: "#/components/schemas/MarketingTemplate" } } } }
  /marketing/templates/{templateId}:
    patch:
      operationId: updateMarketingTemplate
      tags: [marketing]
      parameters: [{ name: templateId, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MarketingTemplateInput" } } }
      responses:
        "200": { description: Updated template, content: { application/json: { schema: { $ref: "#/components/schemas/MarketingTemplate" } } } }
    delete:
      operationId: deleteMarketingTemplate
      tags: [marketing]
      parameters: [{ name: templateId, in: path, required: true, schema: { type: integer } }]
      responses:
        "204": { description: Deleted template }
  /marketing/campaigns:
    get:
      operationId: listMarketingCampaigns
      tags: [marketing]
      responses:
        "200": { description: Campaign drafts, content: { application/json: { schema: { type: object, properties: { campaigns: { type: array, items: { $ref: "#/components/schemas/MarketingCampaign" } } } } } } }
    post:
      operationId: createMarketingCampaignDraft
      tags: [marketing]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MarketingCampaignInput" } } }
      responses:
        "201": { description: Campaign draft, content: { application/json: { schema: { $ref: "#/components/schemas/MarketingCampaign" } } } }
  /marketing/email-status:
    get:
      operationId: getMarketingEmailStatus
      tags: [marketing]
      responses:
        "200": { description: Resend configuration status, content: { application/json: { schema: { $ref: "#/components/schemas/MarketingEmailStatus" } } } }
  /marketing/campaigns/{campaignId}/send:
    post:
      operationId: sendMarketingCampaign
      tags: [marketing]
      parameters: [{ name: campaignId, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: Sent campaign, content: { application/json: { schema: { $ref: "#/components/schemas/MarketingCampaignSendResponse" } } } }
        "409": { description: Campaign cannot be sent }
        "503": { description: Resend is not configured }
  /delivery/{slug}/gallery:
    get:
      operationId: getDeliveryPhotos
